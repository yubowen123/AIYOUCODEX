name: Test

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Run local task-activity regression
        timeout-minutes: 2
        run: node --test vendor/codex-taskboard/test/task-activity.test.mjs
      # Browser fixtures launch multiple Chrome processes each. Serialize files
      # on both runners: macOS also loses renderer connections under parallel load.
      - name: Run all tests with bounded process concurrency
        run: |
          node -e "const os=require('node:os'); console.log(JSON.stringify({platform:process.platform,node:process.version,parallelism:os.availableParallelism(),totalMemoryMiB:Math.round(os.totalmem()/1024**2),freeMemoryMiB:Math.round(os.freemem()/1024**2),testConcurrency:1}))"
          node --test --test-concurrency=1 test/*.test.mjs
        env:
          AIYOUCODEX_REQUIRE_BROWSER: '1'
      - run: node scripts/verify-public-boundary.mjs
      - if: runner.os == 'macOS'
        run: bash -n install.sh uninstall.sh
